<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f62fe" />
    <title>Portal de Materiales</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // Tema antes de pintar (sin destello). "sistema" = sin atributo: manda prefers-color-scheme.
        window.portal = {
            tema: function (t) {
                try { t ? localStorage.setItem('portal-tema', t) : localStorage.removeItem('portal-tema'); } catch (e) { }
                if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
            },
            leerTema: function () { try { return localStorage.getItem('portal-tema') || ''; } catch (e) { return ''; } },
            leer: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            guardar: function (k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { } }
        };
        (function () { var t = window.portal.leerTema(); if (t) document.documentElement.dataset.theme = t; })();
    </script>
</head>

<body>
    <div id="app">
        <div class="arranque" role="status" aria-live="polite">
            <svg class="loading-progress" aria-hidden="true">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
            <p>Cargando Portal de Materiales…</p>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <button type="button" class="dismiss" aria-label="Cerrar">✕</button>
    </div>
    <!-- Ruta estable: MapStaticAssets la resuelve al archivo con huella; los marcadores #[.{fingerprint}]
         no se procesan cuando la API sirve index.html como respaldo de rutas. -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
